name: Recordatorio Instagram

on:
  schedule:
    # Horarios Argentina: 08:00, 12:00, 16:00 y 20:00
    # GitHub Actions usa UTC (Argentina = UTC-3)
    - cron: "0 11,15,19,23 * * *"

  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar Instagram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python instagram.py
