name: Pronostico Villa del Parque

on:
  schedule:
    # GitHub Actions usa UTC. 11:00/23:00 UTC = 08:00/20:00 ART.
    - cron: "0 11,23 * * *"
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar pronostico
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python clima.py
